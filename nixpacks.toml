[phases.setup]
nixPkgs = ["python311", "nodejs_20", "libpq"]

[phases.install]
cmds = [
  "npm --prefix frontend install",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
